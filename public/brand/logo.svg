<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <linearGradient id="cyMag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="planet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#1d3a8a"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Saturn glyph -->
  <g transform="translate(60 60)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="44" ry="10" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="30" ry="6" stroke="#ff2bd6" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="22" fill="url(#planet)"/>
    <circle cx="-6" cy="-4" r="3" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- Wordmark -->
  <text x="120" y="78"
        font-family="'Orbitron', 'Inter', sans-serif"
        font-size="56"
        font-weight="900"
        letter-spacing="6"
        fill="url(#cyMag)"
        filter="url(#glow)">
    CARTHABOT
  </text>

  <!-- Subtitle -->
  <text x="122" y="100"
        font-family="'Orbitron', 'Inter', sans-serif"
        font-size="11"
        letter-spacing="14"
        fill="#9ad7ff"
        opacity="0.7">
    GALACTIC · ARENA
  </text>
</svg>
